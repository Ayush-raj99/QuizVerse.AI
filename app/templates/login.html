<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizVerse AI - Login</title>

    <link rel="stylesheet" href="/static/css/style.css">
    
</head>


<body>


<div class="container">


<header>

<h1>QuizVerse AI</h1>

<p>AI Powered Quiz Platform</p>

</header>



<div class="card">


<h2>Welcome Back 👋</h2>

<p class="subtitle">
Login to continue learning
</p>



<form action="/login" method="post">


<div class="form-group">

<label>Username</label>

<input 
type="text"
name="username"
placeholder="Enter username"
required>

</div>



<div class="form-group">

<label>Password</label>

<input 
type="password"
name="password"
placeholder="Enter password"
required>

</div>



<button type="submit">
Login
</button>


</form>


</div>


<footer>

© 2026 QuizVerse AI

</footer>


</div>


</body>

</html>
