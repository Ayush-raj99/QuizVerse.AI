<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generate Quiz | QuizVerse AI</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            background:#f1f5f9;

            display:flex;

            justify-content:center;

            align-items:center;

            min-height:100vh;

        }

        .card{

            width:500px;

            background:white;

            padding:35px;

            border-radius:20px;

            box-shadow:0 15px 40px rgba(0,0,0,.15);

        }

        h1{

            text-align:center;

            margin-bottom:30px;

            color:#2563eb;

        }

        label{

            display:block;

            margin-top:18px;

            margin-bottom:8px;

            font-weight:bold;

        }

        input,
        select{

            width:100%;

            padding:14px;

            border:2px solid #dbeafe;

            border-radius:10px;

            font-size:16px;

            outline:none;

        }

        input:focus,
        select:focus{

            border-color:#2563eb;

        }

        button{

            width:100%;

            margin-top:30px;

            padding:16px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-size:18px;

            cursor:pointer;

            transition:.3s;

        }

        button:hover{

            background:#1d4ed8;

        }

    </style>

</head>

<body>

<div class="card">

<h1>🧠 Generate Quiz</h1>

<form id="quizForm">

<label>Subject</label>

<input
type="text"
name="subject"
placeholder="Science"
required
>

<label>Chapter</label>

<input
type="text"
name="chapter"
placeholder="Life Processes"
required
>

<label>Difficulty</label>

<select name="difficulty">

<option>Easy</option>

<option selected>Medium</option>

<option>Hard</option>

</select>

<label>Number of Questions</label>

<input
type="number"
name="number"
value="10"
min="5"
max="50"
required
>

<button type="submit">

Generate Questions

</button>

</form>

</div>

<script>

document.getElementById("quizForm").addEventListener("submit",function(e){

    e.preventDefault();

    const form = new FormData(this);

    sessionStorage.setItem(
        "quiz_subject",
        form.get("subject")
    );

    sessionStorage.setItem(
        "quiz_chapter",
        form.get("chapter")
    );

    sessionStorage.setItem(
        "quiz_difficulty",
        form.get("difficulty")
    );

    sessionStorage.setItem(
        "quiz_number",
        form.get("number")
    );

    window.location.href="/loading";

});

</script>

</body>

</html>
